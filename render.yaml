# Render Blueprint — one-click deploy for SatDetect
# https://render.com/docs/blueprint-spec

# No `databases:` block — this project uses an externally hosted MySQL
# server, not Render's managed Postgres. DATABASE_URL below is set manually
# in the Render dashboard (Environment tab), not stored in this file, since
# render.yaml is committed to git and must never contain real credentials.

services:
  - type: web
    name: satdetect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard: mysql+pymysql://user:pass@host:3306/dbname
      - key: SECRET_KEY
        generateValue: true
