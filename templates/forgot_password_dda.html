<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Vedangsoft Change Detection</title>
  <link rel="stylesheet" href="/static/css/style.css?v=32" />
  <link rel="stylesheet" href="/static/css/dda.css?v=22" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card { width: 100%; max-width: 380px; }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      font-weight: 600;
    }
    .auth-sub { color: var(--text-muted); font-size: 0.85rem; margin: -0.35rem 0 1.1rem; }
    .auth-toggle { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }
    .auth-toggle a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        <span>Vedangsoft Change Detection</span>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Forgot password</h3>
        </div>
        <p class="auth-sub">Enter the email on your account and we'll send you a link to reset your password.</p>

        <div id="dda-error" class="alert alert-error hidden"></div>
        <div id="dda-success" class="alert alert-success hidden"></div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required />
          </div>
          <button type="submit" id="forgot-submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>

        <div class="auth-toggle">
          <a href="/login">&larr; Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/dda/shared.js?v=3"></script>
  <script src="/static/js/dda/forgot_password.js?v=1"></script>
</body>
</html>
