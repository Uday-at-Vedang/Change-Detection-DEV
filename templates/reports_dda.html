<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Vedangsoft Change Detection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/css/style.css?v=34" />
  <link rel="stylesheet" href="/static/css/dda.css?v=43" />
</head>
<body>
  <div class="app dda-app">
    {% include "partials/navbar_dda.html" %}

    <div class="dda-main-col">
      {% include "partials/alerts_dda.html" %}

      <section id="tab-reports" class="dda-panel active" role="tabpanel">
        <div class="card">
          <div class="card-header">
            <h3>Detection Reports</h3>
            <div class="dda-reports-toolbar">
              <input type="search" id="reports-filter" class="dda-search" placeholder="Search reports…" />
              <button type="button" class="btn btn-secondary btn-sm" id="btn-reports-refresh">Refresh</button>
            </div>
          </div>
          <p class="sub dim">Completed jobs and detection history. Download PDF or open the browser report.</p>
          <div id="reports-list"><p class="dim">Loading reports…</p></div>
          <div class="pagination" id="reports-pagination"></div>
        </div>
      </section>
    </div>
  </div>

  {% include "partials/result_modal_dda.html" %}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/js/dda/shared.js?v=3"></script>
  <script src="/static/js/dda/app.js?v=26"></script>
  <script src="/static/js/dda/tree.js?v=2"></script>
  <script src="/static/js/dda/map.js?v=4"></script>
  <script src="/static/js/dda/library.js?v=15"></script>
  <script src="/static/js/dda/pairs.js?v=3"></script>
  <script src="/static/js/dda/result.js?v=21"></script>
  <script src="/static/js/dda/compare.js?v=22"></script>
  <script src="/static/js/dda/reports.js?v=7"></script>
  <script src="/static/js/dda/notifications.js?v=5"></script>
</body>
</html>
