<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Vedangsoft Change Detection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/css/style.css?v=38" />
  <link rel="stylesheet" href="/static/css/dda.css?v=65" />
  <link rel="stylesheet" href="/static/css/dda-modernist-sidebar.css?v=1" />
  <link rel="stylesheet" href="/static/css/dda-modernist-reports.css?v=5" />
  <link rel="stylesheet" href="/static/css/dda-modernist-result-modal.css?v=5" />
</head>
<body>
  <div class="app dda-app">
    {% include "partials/navbar_dda.html" %}

    <div class="dda-main-col">
      {% include "partials/alerts_dda.html" %}

      <section id="tab-reports" class="dda-panel active" role="tabpanel">
        <div class="dda-hero dda-reports-hero">
          <div class="dda-hero-row">
            <div>
              <h1>Reports</h1>
              <p class="sub">Every detection run, with its status and review outcome. Download PDF or open the browser report.</p>
            </div>
            <div class="dda-dash-hero-actions">
              <span id="reports-filter-meta" class="dim dda-filter-meta"></span>
              <button type="button" class="btn btn-secondary btn-sm" id="btn-reports-refresh">Refresh</button>
            </div>
          </div>
        </div>

        <div class="card dda-reports-filter-card">
          <div class="dda-filter-bar" id="reports-filter-bar">
            <label class="dda-filter-field">Search
              <input type="search" id="reports-filter" class="dda-search" placeholder="Title, area, status…" />
            </label>
            <label class="dda-filter-field">Status
              <select id="reports-filter-status">
                <option value="">All</option>
                <option value="completed">Completed</option>
                <option value="running">Running</option>
                <option value="queued">Queued</option>
                <option value="failed">Failed</option>
              </select>
            </label>
            <label class="dda-filter-field">Source
              <select id="reports-filter-source">
                <option value="">All</option>
                <option value="manual">Manual</option>
                <option value="auto">Automatic</option>
              </select>
            </label>
            <label class="dda-filter-field">Area
              <select id="reports-filter-zone">
                <option value="">All areas</option>
              </select>
            </label>
            <label class="dda-filter-field">From
              <input type="date" id="reports-filter-from" class="dda-date-input" />
            </label>
            <label class="dda-filter-field">To
              <input type="date" id="reports-filter-to" class="dda-date-input" />
            </label>
            <label class="dda-filter-field">Sort
              <select id="reports-filter-sort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="change-desc">Change % high–low</option>
                <option value="change-asc">Change % low–high</option>
                <option value="title">Title A–Z</option>
              </select>
            </label>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-reports-clear">Clear</button>
          </div>
        </div>

        <div class="card dda-reports-table-card">
          <div id="reports-list"><p class="dim">Loading reports…</p></div>
          <div class="pagination" id="reports-pagination"></div>
        </div>
      </section>
    </div>
  </div>

  {% include "partials/result_modal_dda.html" %}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/js/dda/shared.js?v=8"></script>
  <script src="/static/js/dda/app.js?v=30"></script>
  <script src="/static/js/dda/map.js?v=4"></script>
  <script src="/static/js/dda/result.js?v=29"></script>
  <script src="/static/js/dda/reports.js?v=12"></script>
  <script src="/static/js/dda/notifications.js?v=5"></script>
</body>
</html>
